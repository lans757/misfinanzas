                            <div className="flex items-center gap-0.5 mt-0.5">
                              <span className="text-[9px] font-bold text-[#FFE500] leading-tight">💳</span>
                              {d.cashea.map(c=>(
                                <span key={c.id} className={`text-[9px] font-bold leading-tight ${c.paid?'text-muted line-through':'text-[#FFE500]'}`}>
                                  ${c.amount_usd}
                                </span>
                              ))}
                            </div>
                          )}
                          <div className="flex flex-col gap-0.5 mt-0.5">
                            {d.bcv         && <span className="text-[9px] text-brand-blue/80   font-mono leading-tight">BCV {fmtRate(d.bcv)}</span>}
                            {d.binance_p2p && <span className="text-[9px] text-brand-yellow/80 font-mono leading-tight">₮ {fmtRate(d.binance_p2p)}</span>}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

          {/* Leyenda */}
          <div className="flex items-center gap-4 text-xs text-muted justify-end flex-wrap">
            <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm bg-brand-green/20 border-l-2 border-brand-green"></span>Ingresos &gt; Gastos</span>
            <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm bg-brand-red/20 border-l-2 border-brand-red"></span>Gastos &gt; Ingresos</span>
            <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm bg-[#FFE500]/20 border-l-2 border-[#FFE500]"></span>Pago Cashea</span>
            <span className="flex items-center gap-1.5"><span className="inline-block w-4 h-4 rounded-full bg-brand-blue"></span>Hoy</span>
          </div>

          {/* ── Panel de pagos Cashea ── */}
          <div className="bg-surface border border-border rounded-2xl overflow-hidden">

          {selDay && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={closeModal}>

                <div className="p-5 border-b border-border sticky top-0 bg-surface z-10">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <h3 className="text-white font-black text-lg">{selDay} de {MONTH_NAMES[month-1]} {year}</h3>
                      {dayDetail && (

                </div>

                {loadingDay ? (
                  <div className="p-12 text-center text-muted">Cargando...</div>
                ) : dayDetail ? (
                  <>
                    {/* Resumen */}
                    {dayDetail.transactions.length > 0 && (
                      <div className="grid grid-cols-3 gap-3 p-5 pb-3">
                        <div className="bg-brand-green/10 border border-brand-green/25 rounded-xl p-3 text-center">
                          <div className="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">Ingresos</div>
                          <div className="text-brand-green font-black text-sm">{fmtVES(detailIngresos)}</div>

                          <div className="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">Gastos</div>
                          <div className="text-brand-red font-black text-sm">{fmtVES(detailGastos)}</div>
                        </div>
                        <div className={`rounded-xl p-3 text-center border ${detailNet>=0?'bg-brand-green/10 border-brand-green/25':'bg-brand-red/10 border-brand-red/25'}`}>
                          <div className="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">Neto</div>
                          <div className={`font-black text-sm ${detailNet>=0?'text-brand-green':'text-brand-red'}`}>{fmtVES(detailNet)}</div>
                        </div>
                      </div>
                    )}

                    {/* Pagos Cashea del día */}
                    {dayDetail.cashea && dayDetail.cashea.length > 0 && (
                      <div className="px-5 pb-3 space-y-2">
                        <div className="text-[10px] text-[#FFE500] uppercase tracking-wider font-bold mb-2 flex items-center gap-1.5">
                          <span>💳</span> Pagos Cashea
                        </div>
                        {dayDetail.cashea.map(c=>(
                          <div key={c.id} className={`flex items-center gap-3 rounded-xl px-4 py-2.5 border ${c.paid?'bg-surface-2/40 border-border/40 opacity-60':'bg-[#FFE500]/8 border-[#FFE500]/25'}`}>
                            <div className="flex-1 min-w-0">
                              <div className={`text-sm font-semibold ${c.paid?'text-muted line-through':'text-white'}`}>
                                ${c.amount_usd.toFixed(2)}{c.description?` — ${c.description}`:''}
                              </div>
                            </div>
                            <button onClick={()=>handleCasheaToggle(c.id)}
                              className={`text-xs px-2.5 py-1 rounded-lg font-bold border transition-all shrink-0 ${c.paid?'border-border text-muted hover:border-brand-green hover:text-brand-green':'border-[#FFE500]/40 text-[#FFE500] hover:bg-[#FFE500]/15'}`}>
                              {c.paid?'Reabrir':'Marcar pagado'}
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Movimientos */}
                    <div className="px-5 pb-5 space-y-2">
                      {dayDetail.transactions.length > 0 && (
                        <div className="text-xs text-muted uppercase tracking-wider font-bold mb-3">
                          {dayDetail.transactions.length} movimiento{dayDetail.transactions.length!==1?'s':''}
                        </div>
                      )}
                      {dayDetail.transactions.length===0 && (!dayDetail.cashea || dayDetail.cashea.length===0) && (
                        <div className="text-center py-8 text-muted text-sm">Sin movimientos este día</div>
                      )}
                      {dayDetail.transactions.map(t=>(
                        <div key={t.id} className="flex items-center gap-3 bg-surface-2 border border-border rounded-xl px-4 py-3">
                          <span className={`text-lg font-black shrink-0 ${t.type==='ingreso'?'text-brand-green':'text-brand-red'}`}>{t.type==='ingreso'?'↑':'↓'}</span>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-semibold text-white truncate">{t.description}</div>
                            <div className="text-xs text-muted">{t.category} · {new Date(t.date).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})}</div>
                          </div>
                          <div className="text-right shrink-0">
                            <div className={`text-sm font-black ${t.type==='ingreso'?'text-brand-green':'text-brand-red'}`}>
                              {t.type==='ingreso'?'+':'-'}{fmtVES(t.amount_ves)}
                            </div>
                            <div className="text-xs text-muted">{fmtOrig(t.amount, t.currency)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                ) : null}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    function Header({ rates, onRefresh, loadingRates, tab, setTab, username, onLogout, isAdmin }) {
      const tabs = [
        {id:'dashboard',    label:'Dashboard'},
        {id:'transactions', label:'Movimientos'},

        {id:'calendar',     label:'📅 Calendario'},

              <span className="text-white font-black text-base tracking-tight">MisFinanzas</span>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex items-center gap-1.5 bg-surface-2 border border-border rounded-lg px-3 py-1.5">

                <span className="text-[10px] text-muted">Bs/USDT</span>

              <button onClick={onRefresh}
                className={`text-muted hover:text-white bg-surface-2 border border-border rounded-lg px-2.5 py-1.5 text-base transition-all hover:border-brand-blue ${loadingRates?'spin':''}`}>

              ))}

    /* ── App ─────────────────────────────────────────────────────────────── */
    function App() {
      const [token,           setToken]           = useState(()=>localStorage.getItem(LS_TOKEN));
      const [username,        setUsername]        = useState(()=>localStorage.getItem(LS_USER));
      const [isAdmin,         setIsAdmin]         = useState(false);
      const [tab,             setTab]             = useState('dashboard');
      const [bannerDismissed, setBannerDismissed] = useState(()=>sessionStorage.getItem('demo_banner')==='1');
      const dismissBanner = () => { sessionStorage.setItem('demo_banner','1'); setBannerDismissed(true); };
      const [rates,         setRates]         = useState(null);
      const [rateHistory,   setRateHistory]   = useState([]);
      const [transactions,  setTransactions]  = useState([]);
      const [summary,       setSummary]       = useState(null);
      const [flow,          setFlow]          = useState(null);
      const [goals,         setGoals]         = useState([]);
      const [budgets,       setBudgets]       = useState([]);
      const [budgetStatus,  setBudgetStatus]  = useState([]);
      const [loadingRates,  setLoadingRates]  = useState(false);
      const { show:toast, ToastContainer } = useToast();

      const handleLogout = useCallback(() => {
        localStorage.removeItem(LS_TOKEN);
        localStorage.removeItem(LS_USER);
        setToken(null); setUsername(null); setIsAdmin(false);
        setTransactions([]); setSummary(null); setFlow(null);
        setGoals([]); setBudgets([]); setBudgetStatus([]);
      }, []);

      const api = useCallback(()=>{
        if(!token) return null;
        return makeApi(token, handleLogout);
      }, [token, handleLogout]);

      const loadData = useCallback(async () => {
        const a = api(); if(!a) return;
        await Promise.all([
          a.getTransactions().then(setTransactions).catch(()=>{}),
          a.getSummary().then(d=>{ setSummary(d); setBudgetStatus(d.budget_alerts||[]); }).catch(()=>{}),
          a.getFlow().then(setFlow).catch(()=>{}),
          a.getGoals().then(setGoals).catch(()=>{}),
          a.getBudgets().then(setBudgets).catch(()=>{}),
          a.checkBudgets().then(setBudgetStatus).catch(()=>{}),
        ]);
      }, [api]);

      const loadRates = useCallback(async (silent=false) => {
        const a = api(); if(!a) return;
        setLoadingRates(true);
        try {
          const data = await a.getRates();
          setRates(data);
          a.getRatesHistory().then(setRateHistory).catch(()=>{});
          if(!silent) toast('Tasas actualizadas','success');
        } catch { if(!silent) toast('Error al obtener tasas','error'); }
        finally { setLoadingRates(false); }
      }, [api]);

      const handleAuth = ({ token:t, username:u }) => {
        localStorage.setItem(LS_TOKEN, t);
        localStorage.setItem(LS_USER,  u);
        setToken(t); setUsername(u);
      };

      const handleAdd = async data => {
        const a = api(); if(!a) return;
        try { await a.add(data); await loadData(); toast('Movimiento registrado ✓','success'); }
        catch(e) { toast('Error al guardar','error'); throw e; }
      };

      const handleEdit = async (id, data) => {
        const a = api(); if(!a) return;
        try { await a.edit(id, data); await loadData(); toast('Movimiento actualizado ✓','success'); }
        catch(e) { toast('Error al editar','error'); throw e; }
      };

      const handleDelete = async id => {
        if(!confirm('¿Eliminar este movimiento?')) return;
        const a = api(); if(!a) return;
        try { await a.del(id); await loadData(); toast('Movimiento eliminado','success'); }
        catch { toast('Error al eliminar','error'); }
      };

      const handleGoalCreate = async data => {
        const a = api(); if(!a) return;
        try { await a.createGoal(data); const gs = await a.getGoals(); setGoals(gs); toast('Meta creada ✓','success'); }
        catch { toast('Error al crear meta','error'); }
      };

      const handleGoalDelete = async id => {
        if(!confirm('¿Eliminar esta meta?')) return;
        const a = api(); if(!a) return;
        try { await a.deleteGoal(id); const gs = await a.getGoals(); setGoals(gs); toast('Meta eliminada','success'); }
        catch { toast('Error al eliminar meta','error'); }
      };

      const handleBudgetCreate = async data => {
        const a = api(); if(!a) return;
        try {
          await a.createBudget(data);
          const [bs, cs] = await Promise.all([a.getBudgets(), a.checkBudgets()]);
          setBudgets(bs); setBudgetStatus(cs);
          toast('Presupuesto guardado ✓','success');
        } catch { toast('Error al guardar presupuesto','error'); }
      };

      const handleBudgetDelete = async id => {
        if(!confirm('¿Eliminar este presupuesto?')) return;
        const a = api(); if(!a) return;
        try {
          await a.deleteBudget(id);
          const [bs, cs] = await Promise.all([a.getBudgets(), a.checkBudgets()]);
          setBudgets(bs); setBudgetStatus(cs);
          toast('Presupuesto eliminado','success');
        } catch { toast('Error al eliminar','error'); }
      };

      useEffect(() => {
        if(!token) return;
        const a = makeApi(token, handleLogout);
        a.verifyToken().then(user => {
          if(!user) { handleLogout(); return; }
          setUsername(user.username);
          setIsAdmin(!!user.is_admin);
          loadRates(true);
          loadData();
        });
      }, [token]);

      if(!token) return (
        <>
          <DemoBanner dismissed={bannerDismissed} onDismiss={dismissBanner}/>
          <AuthScreen onAuth={handleAuth}/>
        </>
      );

      return (
        <div className="min-h-screen bg-[#0f1117] text-white">
          <DemoBanner dismissed={bannerDismissed} onDismiss={dismissBanner}/>
          <Header
            rates={rates} onRefresh={()=>loadRates(false)}
            loadingRates={loadingRates} tab={tab} setTab={setTab}
            username={username} onLogout={handleLogout} isAdmin={isAdmin}
          />
          <main className="max-w-7xl mx-auto px-4 py-6">
            {tab==='dashboard'    && <DashboardTab    summary={summary} flow={flow} rates={rates} rateHistory={rateHistory}/>}
            {tab==='transactions' && <TransactionsTab transactions={transactions} rates={rates} onAdd={handleAdd} onEdit={handleEdit} onDelete={handleDelete} token={token}/>}
            {tab==='savings'      && <SavingsTab      summary={summary} rates={rates} transactions={transactions} goals={goals} onGoalCreate={handleGoalCreate} onGoalDelete={handleGoalDelete}/>}
            {tab==='budgets'      && <BudgetTab       budgets={budgets} budgetStatus={budgetStatus} rates={rates} onCreate={handleBudgetCreate} onDelete={handleBudgetDelete}/>}
            {tab==='calendar'     && <CalendarTab     token={token}/>}
            {tab==='ai'           && <AITab           token={token}/>}
            {tab==='feedback'     && <FeedbackTab/>}
            {tab==='admin'        && <AdminTab token={token}/>}
          </main>
          <ToastContainer/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
