<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MisFinanzas 💰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#1a1d27', 2: '#222536' },
            border:  { DEFAULT: '#2d3149' },
            muted:   '#8892a4',
            brand: {
              green: '#00c896', red: '#ff4d6d',
              blue: '#4f8ef7', yellow: '#f7c94f', purple: '#a78bfa'
            }
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; }
    select option { background: #222536; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1d27; }
    ::-webkit-scrollbar-thumb { background: #2d3149; border-radius: 3px; }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    .fade-in { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── Constantes ─────────────────────────────────────────────────────── */
    const CATS_INGRESO  = ['Sueldo','Freelance','Inversión','Bono','Comisión','Negocio','Transferencia recibida','Otro ingreso'];
    const CATS_GASTO    = ['Comida','Transporte','Servicios','Entretenimiento','Salud','Educación','Ropa','Ahorro Binance','Hogar','Deuda','Cashea','Otro gasto'];
    const PAY_METHODS   = ['Efectivo','Pago Móvil','Binance','Transferencia','Zelle','Dólares efectivo','Otro'];
    const CHART_COLORS  = ['#4f8ef7','#00c896','#f7c94f','#ff4d6d','#a78bfa','#fb923c','#34d399','#f87171','#38bdf8','#e879f9'];
    const LS_TOKEN      = 'finanzas_token';
    const LS_USER       = 'finanzas_username';

    /* ── Formatters ─────────────────────────────────────────────────────── */
    const fmtVES  = n => `Bs ${(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    const fmtUSD  = n => `$${(n||0).toFixed(2)}`;
    const fmtUSDT = n => `${(n||0).toFixed(4)} USDT`;
    const fmtDate = d => new Date(d).toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const fmtDateTime = d => {
      const dt = new Date(d);
      return dt.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'2-digit'})
        +' '+dt.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
    };
    const fmtOrig = (amount, currency) =>
      currency==='USDT' ? fmtUSDT(amount) : currency==='USD' ? fmtUSD(amount) : fmtVES(amount);
    const fmtRate = n => n ? n.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}) : '--';
    const fmtAbbr = n => {
      if (!n) return 'Bs 0';
      if (n >= 1e6) return `Bs ${(n/1e6).toFixed(1)}M`;
      if (n >= 1e3) return `Bs ${(n/1e3).toFixed(1)}K`;
      return `Bs ${n.toFixed(0)}`;
    };

    /* ── API client ──────────────────────────────────────────────────────── */
    function makeApi(token, onUnauthorized) {
      const h = { 'Authorization': `Bearer ${token}` };
      const j = { ...h, 'Content-Type': 'application/json' };
      const guard = r => {
        if (r.status===401) { onUnauthorized(); throw new Error('unauthorized'); }
        return r.json();
      };
      return {
        getRates:        () => fetch('/api/rates').then(r=>r.json()),
        getRatesHistory: () => fetch('/api/rates/history',{headers:h}).then(guard),
        getTransactions: (skip=0,limit=500) => fetch(`/api/transactions?skip=${skip}&limit=${limit}`,{headers:h}).then(guard),
        getSummary:      () => fetch('/api/summary',{headers:h}).then(guard),
        getFlow:         () => fetch('/api/monthly-flow',{headers:h}).then(guard),
        verifyToken:     () => fetch('/api/auth/me',{headers:h}).then(r=>r.ok ? r.json() : null),
        add:  data  => fetch('/api/transactions',{method:'POST',headers:j,body:JSON.stringify(data)})
                        .then(async r=>{ if(!r.ok){const e=await r.json();throw e;} return r.json(); }),
        edit: (id,data) => fetch(`/api/transactions/${id}`,{method:'PUT',headers:j,body:JSON.stringify(data)})
                        .then(async r=>{ if(!r.ok){const e=await r.json();throw e;} return r.json(); }),
        del:  id    => fetch(`/api/transactions/${id}`,{method:'DELETE',headers:h}).then(guard),
        exportCSV:   () => {
          const a = document.createElement('a');
          a.href = '/api/export/csv';
          a.setAttribute('download','');
          // pass token via custom header not possible for direct download — use query param workaround
          fetch('/api/export/csv',{headers:h})
            .then(r=>r.blob())
            .then(blob => {
              a.href = URL.createObjectURL(blob);
              a.click();
              URL.revokeObjectURL(a.href);
            });
        },
        // Goals
        getGoals:    () => fetch('/api/goals',{headers:h}).then(guard),
        createGoal:  data => fetch('/api/goals',{method:'POST',headers:j,body:JSON.stringify(data)}).then(async r=>{ if(!r.ok){const e=await r.json();throw e;} return r.json(); }),
        deleteGoal:  id   => fetch(`/api/goals/${id}`,{method:'DELETE',headers:h}).then(guard),
        // Budgets
        getBudgets:    () => fetch('/api/budget-alerts',{headers:h}).then(guard),
        checkBudgets:  () => fetch('/api/budget-alerts/check',{headers:h}).then(guard),
        createBudget:  data => fetch('/api/budget-alerts',{method:'POST',headers:j,body:JSON.stringify(data)}).then(async r=>{ if(!r.ok){const e=await r.json();throw e;} return r.json(); }),
        deleteBudget:  id   => fetch(`/api/budget-alerts/${id}`,{method:'DELETE',headers:h}).then(guard),
        // Calendar
        getCalendar:    (y,m)   => fetch(`/api/calendar/${y}/${m}`,{headers:h}).then(guard),
        getCalendarDay: (y,m,d) => fetch(`/api/calendar/${y}/${m}/${d}`,{headers:h}).then(guard),
        // Cashea
        getCashea:      ()      => fetch('/api/cashea',{headers:h}).then(guard),
        createCashea:   data    => fetch('/api/cashea',{method:'POST',headers:j,body:JSON.stringify(data)}).then(async r=>{ if(!r.ok){const e=await r.json();throw e;} return r.json(); }),
        toggleCashea:   id      => fetch(`/api/cashea/${id}/toggle`,{method:'PUT',headers:h}).then(guard),
        deleteCashea:   id      => fetch(`/api/cashea/${id}`,{method:'DELETE',headers:h}).then(guard),
      };
    }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    function useToast() {
      const [toasts, setToasts] = useState([]);
      const show = (msg, type='success') => {
        const id = Date.now();
        setToasts(p=>[...p,{id,msg,type}]);
        setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
      };
      const ToastContainer = () => (
        <div className="fixed bottom-6 right-6 flex flex-col gap-2 z-50 pointer-events-none">
          {toasts.map(t=>(
            <div key={t.id} className={`fade-in px-4 py-3 rounded-xl border text-sm font-semibold shadow-xl ${
              t.type==='success' ? 'bg-[#0d2118] border-brand-green text-brand-green'
                                 : 'bg-[#220a0f] border-brand-red text-brand-red'
            }`}>{t.msg}</div>
          ))}
        </div>
      );
      return { show, ToastContainer };
    }

    /* ── Charts ─────────────────────────────────────────────────────────── */
    function FlowChart({ data }) {
      const ref = useRef(null); const inst = useRef(null);
      useEffect(()=>{
        if(!ref.current||!data?.labels?.length) return;
        if(inst.current) inst.current.destroy();
        inst.current = new Chart(ref.current, {
          type:'bar',
          data:{ labels:data.labels, datasets:[
            {label:'Ingresos',data:data.ingresos,backgroundColor:'#00c89640',borderColor:'#00c896',borderWidth:2,borderRadius:6},
            {label:'Gastos',  data:data.gastos,  backgroundColor:'#ff4d6d40',borderColor:'#ff4d6d',borderWidth:2,borderRadius:6},
          ]},
          options:{
            responsive:true,maintainAspectRatio:false,
            plugins:{
              legend:{labels:{color:'#8892a4',boxWidth:12}},
              tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmtVES(ctx.raw)}`}}
            },
            scales:{
              x:{ticks:{color:'#8892a4'},grid:{color:'#2d314930'}},
              y:{ticks:{color:'#8892a4',callback:v=>`Bs ${(v/1000).toFixed(0)}K`},grid:{color:'#2d3149'}}
            }
          }
        });
        return ()=>{ if(inst.current) inst.current.destroy(); };
      },[JSON.stringify(data)]);
      return <div style={{height:220}}><canvas ref={ref}/></div>;
    }

    function CategoryChart({ data }) {
      const ref = useRef(null); const inst = useRef(null);
      useEffect(()=>{
        if(!ref.current||!data) return;
        const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,8);
        if(!entries.length) return;
        if(inst.current) inst.current.destroy();
        inst.current = new Chart(ref.current, {
          type:'doughnut',
          data:{
            labels:entries.map(e=>e[0]),
            datasets:[{data:entries.map(e=>e[1]),backgroundColor:CHART_COLORS,borderColor:'#1a1d27',borderWidth:3}]
          },
          options:{
            responsive:true,maintainAspectRatio:false,
            plugins:{
              legend:{position:'right',labels:{color:'#8892a4',font:{size:11},padding:10}},
              tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmtVES(ctx.raw)}`}}
            }
          }
        });
        return ()=>{ if(inst.current) inst.current.destroy(); };
      },[JSON.stringify(data)]);
      return <div style={{height:220}}><canvas ref={ref}/></div>;
    }

    function RateHistoryChart({ data }) {
      const ref = useRef(null); const inst = useRef(null);
      useEffect(()=>{
        if(!ref.current||!data?.length) return;
        if(inst.current) inst.current.destroy();
        const labels  = data.map(r=>(r.date||r.timestamp||'').slice(0,10));
        inst.current = new Chart(ref.current, {
          type:'line',
          data:{ labels, datasets:[
            {label:'BCV (Bs/$)',     data:data.map(r=>r.bcv),        borderColor:'#4f8ef7',backgroundColor:'#4f8ef710',fill:true,tension:.3,pointRadius:2},
            {label:'Binance (Bs/₮)',data:data.map(r=>r.binance_p2p),borderColor:'#f7c94f',backgroundColor:'#f7c94f10',fill:true,tension:.3,pointRadius:2},
          ]},
          options:{
            responsive:true,maintainAspectRatio:false,
            plugins:{legend:{labels:{color:'#8892a4',boxWidth:12}}},
            scales:{
              x:{ticks:{color:'#8892a4',maxTicksLimit:10},grid:{color:'#2d314930'}},
              y:{ticks:{color:'#8892a4'},grid:{color:'#2d3149'}}
            }
          }
        });
        return ()=>{ if(inst.current) inst.current.destroy(); };
      },[JSON.stringify(data)]);
      return <div style={{height:220}}><canvas ref={ref}/></div>;
    }

    /* ── AuthScreen ──────────────────────────────────────────────────────── */
    function AuthScreen({ onAuth }) {
      const [mode,    setMode]    = useState('login');
      const [form,    setForm]    = useState({ username:'', password:'', confirm:'' });
      const [error,   setError]   = useState('');
      const [loading, setLoading] = useState(false);

      const set = (k,v) => { setForm(p=>({...p,[k]:v})); setError(''); };
      const switchMode = m => { setMode(m); setError(''); setForm({username:form.username,password:'',confirm:''}); };

      const handleSubmit = async e => {
        e.preventDefault();
        if (mode==='register') {
          if (form.password!==form.confirm) { setError('Las contraseñas no coinciden'); return; }
          if (form.password.length < 6)     { setError('La contraseña debe tener mínimo 6 caracteres'); return; }
          if (form.username.trim().length<3) { setError('El usuario debe tener mínimo 3 caracteres'); return; }
        }
        setLoading(true); setError('');
        try {
          const url  = mode==='login' ? '/api/auth/login' : '/api/auth/register';
          const resp = await fetch(url, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username:form.username.trim(), password:form.password })
          });
          const data = await resp.json();
          if (!resp.ok) { setError(data.detail || 'Error de autenticación'); }
          else { onAuth({ token:data.access_token, username:data.username }); }
        } catch { setError('Error de conexión. Verifica que el servidor esté activo.'); }
        finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen bg-[#0f1117] flex items-center justify-center p-4">
          <div className="w-full max-w-sm fade-in">
            <div className="text-center mb-8">
              <div className="text-6xl mb-3">💰</div>
              <h1 className="text-3xl font-black text-white tracking-tight">MisFinanzas</h1>
              <p className="text-muted mt-2 text-sm">Gestión personal de ingresos y gastos</p>
            </div>
            <div className="bg-surface border border-border rounded-2xl p-7 shadow-2xl">
              <div className="flex gap-2 mb-6 bg-surface-2 p-1 rounded-xl">
                {['login','register'].map(m=>(
                  <button key={m} onClick={()=>switchMode(m)}
                    className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${
                      mode===m ? 'bg-brand-blue text-white shadow' : 'text-muted hover:text-white'
                    }`}>
                    {m==='login' ? 'Iniciar sesión' : 'Registrarse'}
                  </button>
                ))}
              </div>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Usuario</label>
                  <input type="text" value={form.username} onChange={e=>set('username',e.target.value)}
                    placeholder="tu_nombre_de_usuario" autoFocus required
                    className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] transition-colors" />
                </div>
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Contraseña</label>
                  <input type="password" value={form.password} onChange={e=>set('password',e.target.value)}
                    placeholder={mode==='register' ? 'Mínimo 6 caracteres' : '••••••••'} required
                    className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] transition-colors" />
                </div>
                {mode==='register' && (
                  <div className="fade-in">
                    <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Confirmar contraseña</label>
                    <input type="password" value={form.confirm} onChange={e=>set('confirm',e.target.value)}
                      placeholder="Repite tu contraseña" required
                      className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] transition-colors" />
                  </div>
                )}
                {error && (
                  <div className="fade-in bg-brand-red/10 border border-brand-red/30 text-brand-red text-sm px-4 py-3 rounded-xl flex items-start gap-2">
                    <span className="shrink-0 mt-0.5">⚠</span> {error}
                  </div>
                )}
                <button type="submit" disabled={loading}
                  className={`w-full py-3 rounded-xl font-bold text-sm transition-all mt-1 ${
                    loading ? 'bg-[#3d4266] text-muted cursor-not-allowed'
                            : 'bg-brand-blue hover:bg-[#3d7de0] text-white active:scale-[.98]'
                  }`}>
                  {loading
                    ? <span className="flex items-center justify-center gap-2"><span className="spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"/>Cargando...</span>
                    : mode==='login' ? 'Iniciar sesión →' : 'Crear cuenta →'
                  }
                </button>
              </form>
              {mode==='login' && (
                <p className="text-center text-xs text-muted mt-4">
                  ¿No tienes cuenta?{' '}
                  <button onClick={()=>switchMode('register')} className="text-brand-blue hover:underline">Regístrate gratis</button>
                </p>
              )}
              {mode==='register' && (
                <p className="text-center text-xs text-muted mt-4">
                  ¿Ya tienes cuenta?{' '}
                  <button onClick={()=>switchMode('login')} className="text-brand-blue hover:underline">Inicia sesión</button>
                </p>
              )}
            </div>
            <p className="text-center text-xs text-muted mt-6 opacity-50">Tus datos son privados y solo tú puedes verlos.</p>
          </div>
        </div>
      );
    }

    /* ── TransactionForm (create + edit) ────────────────────────────────── */
    function TransactionForm({ onClose, onSave, rates, editData, token }) {
      const isEdit = Boolean(editData);
      const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
      const [form, setForm] = useState(() => {
        if (isEdit) {
          const d = new Date(editData.date);
          d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
          return {
            type: editData.type, description: editData.description,
            category: editData.category, amount: String(editData.amount),
            currency: editData.currency, payment_method: editData.payment_method || PAY_METHODS[0],
            exchange_rate_bcv: editData.exchange_rate_bcv || '',
            exchange_rate_binance: editData.exchange_rate_binance || '',
            notes: editData.notes || '', tags: editData.tags || '',
            date: d.toISOString().slice(0,16),
          };
        }
        return {
          type:'gasto', description:'', category:CATS_GASTO[0],
          amount:'', currency:'VES', payment_method:PAY_METHODS[0],
          exchange_rate_bcv:rates?.bcv||'', exchange_rate_binance:rates?.binance_p2p||'',
          notes:'', tags:'', date:now.toISOString().slice(0,16),
        };
      });
      const [saving,      setSaving]      = useState(false);
      const [lineaCred,   setLineaCred]   = useState('principal');
      const [cuotas,      setCuotas]      = useState('3');
      const [inicial,     setInicial]     = useState('');
      const [primerCuota, setPrimerCuota] = useState('');

      const set = (k,v) => setForm(p=>({...p,[k]:v}));
      const isCashea = form.category === 'Cashea';

      const handleType = t => {
        set('type', t);
        if (!isEdit) set('category', t==='ingreso' ? CATS_INGRESO[0] : CATS_GASTO[0]);
      };
      const handleCatChange = cat => {
        set('category', cat);
        if (cat === 'Cashea' && !isEdit) {
          set('currency', 'USD');
          if (rates?.bcv) set('exchange_rate_bcv', rates.bcv);
          const d = new Date();
          d.setDate(d.getDate() + 14);
          setPrimerCuota(d.toISOString().slice(0, 10));
          setInicial('');
          setLineaCred('principal');
          setCuotas('3');
        }
      };

      const showBcv     = form.currency !== 'USDT';
      const showBinance = form.currency !== 'VES';

      const preview = (()=>{
        const amt = parseFloat(form.amount);
        if (!amt || amt <= 0) return null;
        if (form.currency==='USD'  && form.exchange_rate_bcv)     return `≈ ${fmtVES(amt*parseFloat(form.exchange_rate_bcv))}`;
        if (form.currency==='USDT' && form.exchange_rate_binance) return `≈ ${fmtVES(amt*parseFloat(form.exchange_rate_binance))}`;
        return null;
      })();

      const handleSubmit = async e => {
        e.preventDefault();
        if (!form.description.trim() || !form.amount) return;
        setSaving(true);
        try {
          await onSave({
            ...form, amount: parseFloat(form.amount),
            exchange_rate_bcv:     form.exchange_rate_bcv    ? parseFloat(form.exchange_rate_bcv)    : null,
            exchange_rate_binance: form.exchange_rate_binance? parseFloat(form.exchange_rate_binance) : null,
            date: new Date(form.date).toISOString(),
            tags: form.tags.trim() || null,
          });
          if (isCashea && token) {
            const jH = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
            const _amtTotal   = parseFloat(form.amount) || 0;
            const _amtInic    = parseFloat(inicial) || 0;
            const _amtRest    = Math.max(0, _amtTotal - _amtInic);
            const _n          = lineaCred === 'cotidiana' ? 1 : (parseInt(cuotas) || 3);
            const _base       = _n > 0 && _amtRest > 0 ? Math.floor(_amtRest * 100 / _n) / 100 : 0;
            const _lineaLabel = lineaCred === 'cotidiana' ? 'Cotidiana' : 'Principal';
            // Pago inicial (hoy)
            if (_amtInic > 0) {
              await fetch('/api/cashea', {
                method: 'POST', headers: jH,
                body: JSON.stringify({
                  due_date:    new Date(form.date).toISOString().slice(0,10) + 'T08:00:00',
                  amount_usd:  parseFloat(_amtInic.toFixed(2)),
                  description: `Inicial — ${form.description}`,
                }),
              });
            }
            // Cuotas cada 14 días (última cuota absorbe el residuo de redondeo)
            if (_base > 0 && primerCuota) {
              for (let i = 0; i < _n; i++) {
                const isLast    = i === _n - 1;
                const _thisCuota = isLast
                  ? parseFloat((_amtRest - _base * (_n - 1)).toFixed(2))
                  : _base;
                const base = new Date(primerCuota + 'T12:00:00');
                const due  = new Date(base.getTime() + i * 14 * 24 * 60 * 60 * 1000);
                await fetch('/api/cashea', {
                  method: 'POST', headers: jH,
                  body: JSON.stringify({
                    due_date:    due.toISOString().slice(0,10) + 'T08:00:00',
                    amount_usd:  _thisCuota,
                    description: `Cuota ${i+1}/${_n} (${_lineaLabel}) — ${form.description}`,
                  }),
                });
              }
            }
          }
        } finally { setSaving(false); }
      };

      const cats         = form.type==='ingreso' ? CATS_INGRESO : CATS_GASTO;
      const amtTotal     = parseFloat(form.amount) || 0;
      const amtInicial   = parseFloat(inicial) || 0;
      const amtRest      = Math.max(0, amtTotal - amtInicial);
      const nCuotas      = lineaCred === 'cotidiana' ? 1 : (parseInt(cuotas) || 3);
      // Floor-division para cuotas iguales; la última absorbe el residuo de redondeo
      const amtPerCuota  = nCuotas > 0 && amtRest > 0 ? Math.floor(amtRest * 100 / nCuotas) / 100 : 0;
      const amtLastCuota = nCuotas > 0 && amtRest > 0
        ? parseFloat((amtRest - amtPerCuota * (nCuotas - 1)).toFixed(2)) : 0;
      const cuotaVES     = amtPerCuota && form.exchange_rate_bcv ? amtPerCuota * parseFloat(form.exchange_rate_bcv) : 0;
      const inicialVES   = amtInicial && form.exchange_rate_bcv ? amtInicial * parseFloat(form.exchange_rate_bcv) : 0;
      const sumPagos     = parseFloat((amtInicial + amtPerCuota * Math.max(0, nCuotas - 1) + amtLastCuota).toFixed(2));
      const balanceOk    = amtTotal > 0 && Math.abs(sumPagos - amtTotal) < 0.005;

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 overflow-y-auto"
          onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="flex min-h-full items-center justify-center p-4 pointer-events-none">

            <div className={`flex items-center justify-between px-6 py-4 border-b shrink-0 ${isCashea?'border-[#FFE500]/20':'border-border'}`}>

                ? <div className="flex items-center gap-2">
                    <span className="text-lg">💳</span>
                    <h2 className="text-base font-bold text-[#FFE500]">{isEdit?'Editar movimiento Cashea':'Registrar con Cashea'}</h2>
                  </div>
                : <h2 className="text-base font-bold text-white">{isEdit?'Editar movimiento':'Registrar movimiento'}</h2>
              }
              <button onClick={onClose} className="text-muted hover:text-white transition-colors w-7 h-7 flex items-center justify-center rounded-lg hover:bg-surface-2">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
              <div className="flex gap-2">
                {['ingreso','gasto'].map(t=>(
                  <button key={t} type="button" onClick={()=>handleType(t)}
                    className={`flex-1 py-2.5 rounded-xl font-semibold text-sm transition-all border ${
                      form.type===t
                        ? t==='ingreso' ? 'bg-brand-green/20 border-brand-green text-brand-green'
                                        : 'bg-brand-red/20 border-brand-red text-brand-red'
                        : 'bg-surface-2 border-border text-muted hover:border-[#4d5169]'
                    }`}>{t==='ingreso'?'↑ Ingreso':'↓ Gasto'}</button>
                ))}
              </div>
              <div>
                <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Descripción *</label>
                <input value={form.description} onChange={e=>set('description',e.target.value)} required
                  placeholder="Ej: Sueldo quincena, Mercado, Celular Samsung..."
                  className={`w-full bg-surface-2 border rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none placeholder-[#4d5169] transition-colors ${isCashea?'border-[#FFE500]/30 focus:border-[#FFE500]':'border-border focus:border-brand-blue'}`} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Categoría</label>
                  <select value={form.category} onChange={e=>handleCatChange(e.target.value)}
                    className={`w-full bg-surface-2 border rounded-lg px-3 py-2.5 text-sm focus:outline-none transition-colors ${isCashea?'border-[#FFE500]/30 focus:border-[#FFE500] text-[#FFE500] font-semibold':'border-border focus:border-brand-blue text-white'}`}>
                    {cats.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Método de pago</label>
                  <select value={form.payment_method} onChange={e=>set('payment_method',e.target.value)}
                    className="w-full bg-surface-2 border border-border rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-blue">
                    {PAY_METHODS.map(m=><option key={m} value={m}>{m}</option>)}

                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">{isCashea?'Total de la compra (USD) *':'Monto *'}</label>
                  <input type="number" step="0.01" min="0" value={form.amount} onChange={e=>set('amount',e.target.value)} required
                    placeholder="0.00"
                    className={`w-full bg-surface-2 border rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none placeholder-[#4d5169] transition-colors ${isCashea?'border-[#FFE500]/30 focus:border-[#FFE500]':'border-border focus:border-brand-blue'}`} />
                  {isCashea && <p className="text-[10px] text-muted mt-1">Precio completo del artículo / servicio</p>}
                </div>
                <div>
                  <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Moneda {isCashea&&<span className="text-[#FFE500] text-[10px] normal-case font-bold ml-1">↑ anclado BCV</span>}</label>
                  <select value={form.currency} onChange={e=>set('currency',e.target.value)}

              {/* ── Sección de cuotas Cashea ── */}

                    <label className="block text-[10px] text-muted uppercase tracking-wider mb-1.5 font-bold">

                    <input type="number" step="0.01" min="0" max={amtTotal||undefined} value={inicial} onChange={e=>setInicial(e.target.value)}
                      placeholder="Ej: 20.00"
                      className="w-full bg-surface border border-[#FFE500]/30 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FFE500] placeholder-[#4d5169]" />
                    <div className="flex justify-between mt-1">
                      {inicialVES > 0
                        ? <span className="text-[10px] text-[#FFE500]/70">≈ {fmtVES(inicialVES)} al BCV</span>
                        : <span/>}
                      {amtTotal > 0 && amtInicial > 0 && amtRest > 0 &&
                        <span className="text-[10px] text-muted">Financia: <span className="text-white font-semibold">${amtRest.toFixed(2)}</span></span>}
                    </div>
                    {amtInicial > amtTotal && amtTotal > 0 &&
                      <p className="text-[10px] text-brand-red mt-1">⚠ El inicial no puede superar el total</p>}
                  </div>

                  {/* Línea de crédito */}
                  <div>
                    <label className="block text-[10px] text-muted uppercase tracking-wider mb-2 font-bold">Línea de crédito</label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id:'principal', label:'Principal', sub:'3, 6 o 9 cuotas' },
                        { id:'cotidiana', label:'Cotidiana', sub:'1 cuota' },
                      ].map(l=>(
                        <button key={l.id} type="button"
                          onClick={()=>{ setLineaCred(l.id); setCuotas(l.id==='cotidiana'?'1':'3'); }}
                          className={`rounded-xl p-3 text-left border transition-all ${lineaCred===l.id?'bg-[#FFE500]/15 border-[#FFE500] text-[#FFE500]':'bg-surface border-border text-muted hover:border-[#FFE500]/40'}`}>

                          <div className="text-[10px] opacity-70">{l.sub}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* N° cuotas (sólo línea principal) */}
                  {lineaCred === 'principal' && (
                    <div className="grid grid-cols-3 gap-2">
                      {['3','6','9'].map(n=>(
                        <button key={n} type="button" onClick={()=>setCuotas(n)}
                          className={`py-2.5 rounded-lg text-sm font-bold border transition-all ${cuotas===n?'bg-[#FFE500] border-[#FFE500] text-[#1a1500]':'bg-surface border-border text-muted hover:border-[#FFE500]/40'}`}>
                          {n} cuotas
                        </button>
                      ))}
                    </div>
                  )}

                  {/* Fecha primera cuota */}
                  <div>
                    <label className="block text-[10px] text-muted uppercase tracking-wider mb-1.5 font-bold">Fecha primera cuota</label>
                    <input type="date" value={primerCuota} onChange={e=>setPrimerCuota(e.target.value)}
                      className="w-full bg-surface border border-[#FFE500]/30 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FFE500]" />
                    <p className="text-[10px] text-muted mt-1">Las cuotas se cobran cada 14 días automáticamente</p>
                  </div>

                  {/* Preview plan de pagos */}
                  {amtTotal > 0 && (
                    <div className="bg-[#FFE500]/5 rounded-xl p-3 space-y-1.5">
                      <div className="text-[10px] text-[#FFE500] font-black uppercase tracking-wider mb-2">📅 Plan de pagos</div>

                      {amtInicial > 0 && (
                        <div className="flex justify-between items-center text-xs py-1 border-b border-[#FFE500]/15">
                          <div>
                            <span className="text-white font-semibold">Hoy</span>
                            <span className="text-muted ml-2">Inicial</span>
                          </div>
                          <span className="text-[#FFE500] font-black">${amtInicial.toFixed(2)}{inicialVES?' ≈ '+fmtVES(inicialVES):''}</span>
                        </div>
                      )}

                      {amtPerCuota > 0 && primerCuota && Array.from({length: nCuotas}).map((_,i)=>{
                        const base     = new Date(primerCuota + 'T12:00:00');
                        const due      = new Date(base.getTime() + i * 14 * 24 * 60 * 60 * 1000);
                        const isLast   = i === nCuotas - 1;
                        const thisMnt  = isLast ? amtLastCuota : amtPerCuota;
                        const thisVES  = thisMnt && form.exchange_rate_bcv ? thisMnt * parseFloat(form.exchange_rate_bcv) : 0;
                        return (
                          <div key={i} className="flex justify-between items-center text-xs py-1 border-b border-[#FFE500]/10 last:border-0">
                            <div>
                              <span className="text-white font-semibold">{due.toLocaleDateString('es-VE',{day:'2-digit',month:'short'})}</span>
                              <span className="text-muted ml-2">Cuota {i+1}{isLast?' (Última)':''}</span>
                            </div>
                            <span className="text-[#FFE500] font-bold">${thisMnt.toFixed(2)}{thisVES?' ≈ '+fmtVES(thisVES):''}</span>
                          </div>
                        );
                      })}

                      {amtTotal > 0 && (
                        <div className={`flex justify-between items-center text-xs pt-2 border-t mt-1 ${balanceOk?'border-brand-green/30':'border-brand-red/30'}`}>
                          <span className={`font-black ${balanceOk?'text-brand-green':'text-brand-red'}`}>
                            {balanceOk ? '✓ Cuadra perfecto' : '⚠ No cuadra'}
                          </span>
                          <span className={`font-black ${balanceOk?'text-brand-green':'text-brand-red'}`}>
                            ${sumPagos.toFixed(2)} {balanceOk ? '=' : '≠'} ${amtTotal.toFixed(2)}
                          </span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              <button type="submit" disabled={saving}
                className={`w-full py-3 rounded-xl font-bold text-sm transition-all ${
                  saving ? 'bg-[#3d4266] text-muted cursor-not-allowed'
                  : isCashea ? 'bg-[#FFE500] hover:bg-[#e6cf00] text-[#1a1500] active:scale-95'
                  : form.type==='ingreso' ? 'bg-brand-green hover:bg-[#00b386] text-[#0a1a12] active:scale-95'
                                          : 'bg-brand-blue hover:bg-[#3d7de0] text-white active:scale-95'
                }`}>
                {saving ? 'Guardando...'
                  : isEdit ? 'Guardar cambios'
                  : isCashea ? `💳 Registrar${primerCuota?' y crear plan de pagos':''}`
                  : `Registrar ${form.type==='ingreso'?'Ingreso':'Gasto'}`}
              </button>
            </form>
          </div>
          </div>
        </div>
      );
    }

    /* ── SummaryCard ─────────────────────────────────────────────────────── */
    function SummaryCard({ label, value, sub, icon, colorKey }) {
      const cm = {
        blue:   { bg:'bg-brand-blue/10',   text:'text-brand-blue',   border:'border-brand-blue/30'   },
        green:  { bg:'bg-brand-green/10',  text:'text-brand-green',  border:'border-brand-green/30'  },
        yellow: { bg:'bg-brand-yellow/10', text:'text-brand-yellow', border:'border-brand-yellow/30' },
        red:    { bg:'bg-brand-red/10',    text:'text-brand-red',    border:'border-brand-red/30'    },
      };
      const c = cm[colorKey];
      return (
        <div className={`bg-surface border ${c.border} rounded-2xl p-4 flex items-start gap-3`}>
          <div className={`${c.bg} ${c.text} w-10 h-10 rounded-xl flex items-center justify-center text-base font-bold shrink-0`}>{icon}</div>
          <div className="min-w-0">
            <p className="text-[11px] text-muted uppercase tracking-wider truncate">{label}</p>
            <p className={`text-lg font-bold ${c.text} mt-0.5 truncate`}>{value}</p>
            {sub && <p className="text-xs text-muted mt-0.5 truncate">{sub}</p>}
          </div>
        </div>
      );
    }

    /* ── DashboardTab ────────────────────────────────────────────────────── */
    function DashboardTab({ summary, flow, rates, rateHistory }) {
      if (!summary) return <div className="flex items-center justify-center h-64 text-muted text-sm">Cargando datos...</div>;
      const saldoUSD = rates?.bcv        ? summary.saldo_ves/rates.bcv         : null;
      const usdtVES  = rates?.binance_p2p ? summary.usdt_balance*rates.binance_p2p : null;
      const cards = [
        { label:'Saldo en Bolívares',   value:fmtVES(summary.saldo_ves),
          sub:`+${fmtVES(summary.total_ingresos_ves)} / -${fmtVES(summary.total_gastos_ves)}`, icon:'Bs', colorKey:'blue' },
        { label:'Equivalente USD (BCV)', value:saldoUSD!=null?fmtUSD(saldoUSD):'--',
          sub:rates?.bcv?`Tasa BCV: ${fmtRate(rates.bcv)} Bs/$`:'Sin tasa BCV', icon:'$', colorKey:'green' },
        { label:'Saldo USDT (Binance)',  value:fmtUSDT(summary.usdt_balance),
          sub:usdtVES!=null?fmtVES(usdtVES):'Sin tasa Binance', icon:'₮', colorKey:'yellow' },
        { label:'Gastos este mes',       value:fmtVES(summary.monthly_gastos),
          sub:`Ingresos mes: ${fmtVES(summary.monthly_ingresos)}`, icon:'↓', colorKey:'red' },
      ];
      const alerts = summary.budget_alerts || [];
      return (
        <div className="space-y-6 fade-in">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {cards.map(c=><SummaryCard key={c.label} {...c}/>)}
          </div>

          {alerts.length > 0 && (
            <div className="bg-surface border border-brand-red/30 rounded-2xl p-4">
              <h3 className="text-sm font-semibold text-brand-red mb-3">⚠ Alertas de presupuesto este mes</h3>
              <div className="space-y-2">
                {alerts.map(a=>(
                  <div key={a.category} className="flex items-center gap-3">
                    <span className="text-xs text-white w-28 shrink-0 truncate">{a.category}</span>
                    <div className="flex-1 bg-surface-2 rounded-full h-2 overflow-hidden">
                      <div className={`h-full rounded-full transition-all ${a.pct>=100?'bg-brand-red':'bg-brand-yellow'}`}
                        style={{width:`${Math.min(a.pct,100)}%`}}/>
                    </div>
                    <span className={`text-xs font-bold shrink-0 ${a.pct>=100?'text-brand-red':'text-brand-yellow'}`}>{a.pct}%</span>
                    <span className="text-xs text-muted shrink-0">{fmtVES(a.spent_ves)} / {fmtVES(a.limit_ves)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className="bg-surface border border-border rounded-2xl p-5">
              <h3 className="text-sm font-semibold text-white mb-4">Flujo mensual (últimos 6 meses)</h3>
              {flow?.labels?.length ? <FlowChart data={flow}/> : <div className="flex items-center justify-center h-48 text-muted text-sm">Sin datos suficientes</div>}
            </div>
            <div className="bg-surface border border-border rounded-2xl p-5">
              <h3 className="text-sm font-semibold text-white mb-4">Gastos por categoría</h3>
              {Object.keys(summary.categories||{}).length
                ? <CategoryChart data={summary.categories}/>
                : <div className="flex items-center justify-center h-48 text-muted text-sm">Sin gastos registrados</div>}
            </div>
          </div>

          {rateHistory?.length > 1 && (
            <div className="bg-surface border border-border rounded-2xl p-5">
              <h3 className="text-sm font-semibold text-white mb-4">Historial de tasas (últimas lecturas)</h3>
              <RateHistoryChart data={rateHistory}/>
            </div>
          )}
        </div>
      );
    }

    /* ── TransactionsTab ─────────────────────────────────────────────────── */
    function TransactionsTab({ transactions, rates, onAdd, onEdit, onDelete, token }) {
      const [showForm, setShowForm] = useState(false);
      const [editTxn,  setEditTxn]  = useState(null);
      const [filter,   setFilter]   = useState({ type:'', category:'', search:'' });
      const allCats = [...new Set(transactions.map(t=>t.category))].sort();
      const setF = (k,v) => setFilter(p=>({...p,[k]:v}));
      const filtered = transactions.filter(t=>{
        if(filter.type     && t.type!==filter.type) return false;
        if(filter.category && t.category!==filter.category) return false;
        if(filter.search   && !t.description.toLowerCase().includes(filter.search.toLowerCase())
                           && !(t.tags||'').toLowerCase().includes(filter.search.toLowerCase())) return false;
        return true;
      });
      const handleSave = async data => { await onAdd(data); setShowForm(false); };
      const handleEditSave = async data => { await onEdit(editTxn.id, data); setEditTxn(null); };

      const downloadCSV = () => {
        const rows = [
          ['Fecha','Tipo','Categoría','Descripción','Monto','Moneda','Monto Bs','Método','Notas','Tags'],
          ...transactions.map(t=>[
            fmtDateTime(t.date), t.type, t.category, t.description,
            t.amount, t.currency, t.amount_ves, t.payment_method||'', t.notes||'', t.tags||''
          ])
        ];
        const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `misfinanzas_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      return (
        <div className="space-y-4 fade-in">
          <div className="flex flex-wrap gap-3 items-center">
            <input value={filter.search} onChange={e=>setF('search',e.target.value)} placeholder="🔍  Buscar descripción o tag..."
              className="bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] w-52"/>
            <select value={filter.type} onChange={e=>setF('type',e.target.value)}
              className="bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-blue">
              <option value="">Todos los tipos</option><option value="ingreso">Ingresos</option><option value="gasto">Gastos</option>
            </select>
            <select value={filter.category} onChange={e=>setF('category',e.target.value)}

    /* ── SavingsTab ──────────────────────────────────────────────────────── */

                          {g.notes && <p className="text-xs text-muted">{g.notes}</p>}

                        <div className="flex items-center gap-2 shrink-0 ml-3">
                          <span className={`text-xs font-bold ${pct>=100?'text-brand-green':'text-brand-yellow'}`}>{pct.toFixed(1)}%</span>
                          <button onClick={()=>onGoalDelete(g.id)} className="text-muted hover:text-brand-red transition-colors p-1 rounded hover:bg-brand-red/10">✕</button>

                      </div>
                      <div className="bg-surface rounded-full h-2 overflow-hidden mb-2">
                        <div className={`h-full rounded-full transition-all duration-500 ${pct>=100?'bg-brand-green':'bg-brand-purple'}`}
                          style={{width:`${pct}%`}}/>

                      <div className="flex justify-between text-xs text-muted">
                        <span>{fmtUSDT(usdt)} actual</span>

                      <p className="text-sm text-white font-medium">{t.description}</p>
                      <p className="text-xs text-muted">{fmtDate(t.date)} · {t.category}</p>
                    </div>
                  </div>
                  <div className="text-right shrink-0 ml-4">
                    <p className={`text-sm font-bold ${t.type==='ingreso'?'text-brand-green':'text-brand-red'}`}>
                      {t.type==='ingreso'?'+':'-'}{fmtUSDT(t.amount)}
                    </p>
                    <p className="text-xs text-muted">{fmtVES(t.amount_ves)}</p>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    /* ── BudgetTab ───────────────────────────────────────────────────────── */
    function BudgetTab({ budgets, budgetStatus, rates, onCreate, onDelete }) {
      const [form, setForm] = useState({ category: CATS_GASTO[0], limit_ves: '' });

      const handleSubmit = async e => {

    /* ── AITab ───────────────────────────────────────────────────────────── */
    const SUGGESTED = [
      '¿Cuánto gasté este mes?',
      '¿Cómo están mis ahorros en USDT?',
      '¿En qué categoría gasto más?',
      'Dame un consejo de ahorro',
      '¿Cuánto dinero tengo disponible?',
      '¿Cuál es mi balance general?',
    ];

    function AITab({ token }) {
      const [configured, setConfigured] = useState(null);
      const [apiKeyInput, setApiKeyInput] = useState('');
      const [savingKey,   setSavingKey]   = useState(false);
      const [keyError,    setKeyError]    = useState('');
      const [messages,    setMessages]    = useState([]);
      const [input,       setInput]       = useState('');
      const [loading,     setLoading]     = useState(false);
      const bottomRef = useRef(null);
      const inputRef  = useRef(null);
      const h = { 'Authorization': `Bearer ${token}` };

      useEffect(()=>{
        fetch('/api/ai/status',{headers:h}).then(r=>r.json()).then(d=>setConfigured(d.configured)).catch(()=>setConfigured(false));
      },[]);

      useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[messages, loading]);

      const saveKey = async e => {
        e.preventDefault(); setKeyError(''); setSavingKey(true);
        try {
          const r = await fetch('/api/ai/key',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({api_key:apiKeyInput})});
          const d = await r.json();
          if(!r.ok) { setKeyError(d.detail||'Error guardando la key'); }
          else { setConfigured(true); }
        } catch { setKeyError('Error de conexión'); }
        finally { setSavingKey(false); }
      };

      const sendMessage = async (text) => {
        if(!text.trim()||loading) return;
        const userMsg = {role:'user', content:text.trim()};
        const newMsgs = [...messages, userMsg];
        setMessages(newMsgs); setInput(''); setLoading(true);
        try {
          const r = await fetch('/api/ai/chat',{
            method:'POST', headers:{...h,'Content-Type':'application/json'},
            body: JSON.stringify({messages: newMsgs})
          });
          const d = await r.json();
          if(!r.ok) throw new Error(d.detail||'Error');
          setMessages(prev=>[...prev,{role:'assistant',content:d.response}]);
        } catch(e) {
          setMessages(prev=>[...prev,{role:'assistant',content:`⚠️ ${e.message}`}]);
        } finally { setLoading(false); setTimeout(()=>inputRef.current?.focus(),100); }
      };

      const handleKey = e => { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(input); } };

      if(configured===null) return <div className="flex items-center justify-center h-64 text-muted text-sm">Cargando...</div>;

      if(!configured) return (
        <div className="max-w-lg mx-auto fade-in">
          <div className="bg-surface border border-border rounded-2xl p-8 text-center">
            <div className="text-5xl mb-4">🤖</div>
            <h2 className="text-xl font-bold text-white mb-2">Configura el Asistente IA</h2>
            <p className="text-muted text-sm mb-6">Usa <span className="text-brand-blue font-semibold">Google Gemini</span> (gratis) para analizar tus finanzas con inteligencia artificial.</p>
            <div className="bg-surface-2 border border-border rounded-xl p-4 text-left mb-6 space-y-2">
              <p className="text-xs font-bold text-white uppercase tracking-wider mb-3">Cómo obtener tu API key gratis:</p>
              {['Ve a aistudio.google.com', 'Inicia sesión con tu cuenta Google', 'Clic en "Get API Key" → "Create API key"', 'Copia la key y pégala aquí abajo'].map((s,i)=>(
                <div key={i} className="flex items-start gap-3">
                  <span className="w-5 h-5 bg-brand-blue/20 text-brand-blue rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">{i+1}</span>
                  <span className="text-sm text-muted">{s}</span>
                </div>
              ))}
            </div>
            <form onSubmit={saveKey} className="space-y-3">
              <input value={apiKeyInput} onChange={e=>{setApiKeyInput(e.target.value);setKeyError('');}}
                placeholder="AIza..." required
                className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] font-mono" />
              {keyError && <p className="text-brand-red text-xs text-left">⚠️ {keyError}</p>}
              <button type="submit" disabled={savingKey||!apiKeyInput.trim()}
                className={`w-full py-3 rounded-xl font-bold text-sm transition-all ${
                  savingKey||!apiKeyInput.trim() ? 'bg-[#3d4266] text-muted cursor-not-allowed' : 'bg-brand-blue hover:bg-[#3d7de0] text-white active:scale-95'
                }`}>
                {savingKey ? 'Guardando...' : '✓ Guardar y activar'}
              </button>
            </form>
            <p className="text-xs text-muted mt-4 opacity-60">Tu API key se guarda en el servidor local. Plan gratuito: 1M tokens/día.</p>
          </div>
        </div>
      );

      return (
        <div className="flex flex-col fade-in" style={{height:'calc(100vh - 130px)'}}>
          <div className="flex-1 overflow-y-auto space-y-4 pr-1 pb-2">
            {messages.length===0 && (
              <div className="text-center py-8">
                <div className="text-4xl mb-3">🤖</div>
                <p className="text-white font-semibold mb-1">Asistente Financiero IA</p>
                <p className="text-muted text-sm mb-6">Pregúntame sobre tus finanzas. Tengo acceso a todos tus datos.</p>
                <div className="flex flex-wrap gap-2 justify-center">
                  {SUGGESTED.map(s=>(
                    <button key={s} onClick={()=>sendMessage(s)}
                      className="bg-surface border border-border hover:border-brand-blue/50 text-muted hover:text-white text-xs px-3 py-2 rounded-xl transition-all">
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {messages.map((m,i)=>(
              <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
                <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${
                  m.role==='user'
                    ? 'bg-brand-blue text-white rounded-br-md'

                }`} style={{whiteSpace:'pre-wrap',lineHeight:'1.6'}}>

                  <div className="flex gap-1 items-center">
                    {[0,1,2].map(i=>(
                      <div key={i} className="w-2 h-2 bg-muted rounded-full animate-bounce" style={{animationDelay:`${i*0.15}s`}}/>

                rows={1} disabled={loading}
                className="flex-1 bg-surface border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] resize-none disabled:opacity-50"
                style={{maxHeight:'120px'}}/>
              <button onClick={()=>sendMessage(input)} disabled={!input.trim()||loading}
                className={`px-4 rounded-xl font-bold text-sm transition-all shrink-0 ${
                  !input.trim()||loading ? 'bg-[#3d4266] text-muted cursor-not-allowed' : 'bg-brand-blue hover:bg-[#3d7de0] text-white active:scale-95'
                }`}>
                ➤
              </button>
            </div>
            <p className="text-xs text-muted mt-1.5 text-center opacity-50">Gemini 2.0 Flash · Tus datos financieros se envían como contexto</p>
          </div>

    /* ── AdminTab ───────────────────────────────────────────────────────── */
    function AdminTab({ token }) {
      const [view,          setView]          = useState('feedback');
      const [feedback,      setFeedback]      = useState([]);
      const [users,         setUsers]         = useState([]);
      const [loading,       setLoading]       = useState(true);
      const [selectedImage, setSelectedImage] = useState(null);

      const h = { 'Authorization': `Bearer ${token}` };

      const TYPE_STYLE = {
        bug:        { label:'🐛 Bug / Falla',  cls:'text-brand-red    bg-brand-red/10    border-brand-red/30'    },
        suggestion: { label:'💡 Sugerencia',   cls:'text-brand-yellow bg-brand-yellow/10 border-brand-yellow/30' },
        other:      { label:'💬 Otro',         cls:'text-brand-blue   bg-brand-blue/10   border-brand-blue/30'   },
      };

      const loadFeedback = async () => {
        setLoading(true);
        try {
          const r = await fetch('/api/admin/feedback', { headers: h });
          if (r.ok) setFeedback(await r.json());
        } finally { setLoading(false); }
      };

      const loadUsers = async () => {
        setLoading(true);
        try {
          const r = await fetch('/api/admin/users', { headers: h });
          if (r.ok) setUsers(await r.json());
        } finally { setLoading(false); }
      };

      useEffect(() => {
        if (view === 'feedback') loadFeedback();
        else loadUsers();
      }, [view]);

      const deleteFeedback = async id => {
        if (!confirm('¿Eliminar este reporte?')) return;
        await fetch(`/api/admin/feedback/${id}`, { method:'DELETE', headers:h });
        setFeedback(f => f.filter(x => x.id !== id));
      };

      const deleteUser = async id => {
        if (!confirm('¿Eliminar este usuario y todos sus datos?')) return;
        const r = await fetch(`/api/admin/users/${id}`, { method:'DELETE', headers:h });
        if (r.ok) setUsers(u => u.filter(x => x.id !== id));
        else { const e = await r.json(); alert(e.detail || 'Error'); }
      };

      return (
        <div>
          <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
            <div>
              <h2 className="text-xl font-black text-white">Panel de administración</h2>
              <p className="text-muted text-sm mt-0.5">Solo visible para el usuario admin</p>
            </div>
            <div className="flex gap-2">
              {[['feedback','💬 Reportes'],['users','👥 Usuarios']].map(([v,l])=>(
                <button key={v} onClick={()=>setView(v)}
                  className={`px-4 py-2 rounded-xl text-sm font-semibold border transition-all ${
                    view===v ? 'bg-brand-blue/20 border-brand-blue text-brand-blue' : 'bg-surface-2 border-border text-muted hover:text-white'
                  }`}>{l}</button>
              ))}
              <button onClick={()=>view==='feedback'?loadFeedback():loadUsers()}
                className="px-3 py-2 rounded-xl text-base text-muted hover:text-white bg-surface-2 border border-border transition-all">↻</button>
            </div>
          </div>

          {loading ? (
            <div className="text-center py-20 text-muted">Cargando...</div>
          ) : view === 'feedback' ? (
            feedback.length === 0 ? (
              <div className="text-center py-20 text-muted">
                <div className="text-4xl mb-3">📭</div>
                <p>No hay reportes aún</p>
              </div>
            ) : (
              <div className="space-y-4">
                <p className="text-muted text-sm">{feedback.length} reporte(s)</p>
                {feedback.map(fb => {
                  const t = TYPE_STYLE[fb.type] || TYPE_STYLE.other;
                  return (
                    <div key={fb.id} className="bg-surface border border-border rounded-2xl p-5 fade-in">
                      <div className="flex items-start justify-between gap-4 flex-wrap">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className={`text-xs font-bold px-2.5 py-1 rounded-lg border ${t.cls}`}>{t.label}</span>
                          <span className="text-white font-semibold">{fb.name}</span>
                          <span className="text-muted text-xs">{new Date(fb.created_at).toLocaleString('es-VE')}</span>
                        </div>
                        <button onClick={()=>deleteFeedback(fb.id)}
                          className="text-muted hover:text-brand-red text-sm px-3 py-1 rounded-lg hover:bg-brand-red/10 border border-transparent hover:border-brand-red/30 transition-all">
                          Eliminar
                        </button>
                      </div>
                      <p className="text-sm text-[#c8d0e0] mt-3 whitespace-pre-wrap leading-relaxed">{fb.description}</p>
                      {fb.image_data && (
                        <div className="mt-3">
                          <img src={fb.image_data} alt="captura"
                            className="max-h-56 rounded-xl object-contain cursor-zoom-in border border-border hover:opacity-90 transition-opacity"
                            onClick={()=>setSelectedImage(fb.image_data)}/>
                          <p className="text-xs text-muted mt-1">Clic para ampliar</p>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )
          ) : (
            users.length === 0 ? (
              <div className="text-center py-20 text-muted">No hay usuarios</div>
            ) : (
              <div className="space-y-2">
                <p className="text-muted text-sm mb-4">{users.length} usuario(s) registrado(s)</p>
                {users.map(u => (
                  <div key={u.id} className="bg-surface border border-border rounded-xl px-5 py-3 flex items-center justify-between gap-4 fade-in">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 bg-brand-blue/20 rounded-full flex items-center justify-center text-xs font-bold text-brand-blue uppercase">
                        {u.username[0]}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-white font-semibold text-sm">{u.username}</span>
                          {u.is_admin && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-purple/20 text-brand-purple border border-brand-purple/30">ADMIN</span>}
                        </div>
                        <span className="text-muted text-xs">Registrado: {new Date(u.created_at).toLocaleDateString('es-VE')}</span>
                      </div>
                    </div>
                    {!u.is_admin && (
                      <button onClick={()=>deleteUser(u.id)}
                        className="text-muted hover:text-brand-red text-sm px-3 py-1 rounded-lg hover:bg-brand-red/10 border border-transparent hover:border-brand-red/30 transition-all">
                        Eliminar
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )
          )}

          {selectedImage && (
            <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 cursor-zoom-out"
              onClick={()=>setSelectedImage(null)}>
              <img src={selectedImage} className="max-w-full max-h-full rounded-2xl object-contain shadow-2xl" alt="captura ampliada"/>
            </div>
          )}
        </div>
      );
    }

    /* ── DemoBanner ─────────────────────────────────────────────────────── */

      return (
        <div className="bg-brand-yellow/10 border-b border-brand-yellow/30 px-4 py-2.5 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2 text-sm text-brand-yellow">
            <span className="shrink-0 text-base">⚠</span>
            <span>Esta es una versión de demostración. <strong>Los datos y usuarios pueden borrarse en cualquier momento</strong> sin previo aviso. No uses información sensible real.</span>

    /* ── FeedbackTab ─────────────────────────────────────────────────────── */
    function FeedbackTab() {
      const TYPES = [['bug','🐛 Bug / Falla'],['suggestion','💡 Sugerencia'],['other','💬 Otro']];
      const [form,    setForm]    = useState({ type:'bug', name:'', description:'', image_data:null });
      const [preview, setPreview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [sent,    setSent]    = useState(false);
      const [error,   setError]   = useState('');

      const set = (k,v) => setForm(p=>({...p,[k]:v}));

      const handleImage = e => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { setError('La imagen no puede superar 5 MB'); return; }
        const reader = new FileReader();
        reader.onload = ev => { setPreview(ev.target.result); set('image_data', ev.target.result); };
        reader.readAsDataURL(file);
      };

      const handleSubmit = async e => {
        e.preventDefault();
        if (!form.description.trim()) { setError('La descripción es obligatoria'); return; }
        setLoading(true); setError('');
        try {
          const r = await fetch('/api/feedback', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(form),
          });
          if (r.ok) { setSent(true); }
          else      { setError('Error al enviar. Intenta de nuevo.'); }
        } catch { setError('Error de conexión.'); }
        finally { setLoading(false); }
      };

      const reset = () => { setSent(false); setForm({type:'bug',name:'',description:'',image_data:null}); setPreview(null); setError(''); };

      if (sent) return (
        <div className="max-w-lg mx-auto text-center py-20 fade-in">
          <div className="text-5xl mb-4">✅</div>
          <h2 className="text-2xl font-black text-white mb-2">¡Gracias por tu reporte!</h2>
          <p className="text-muted mb-6">Tu feedback ayuda a mejorar la app.</p>
          <button onClick={reset}
            className="bg-brand-blue text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-[#3d7de0] transition-all">
            Enviar otro
          </button>
        </div>
      );

      return (
        <div className="max-w-lg mx-auto fade-in">
          <div className="mb-6">
            <h2 className="text-xl font-black text-white">Reportar falla o sugerencia</h2>
            <p className="text-muted text-sm mt-1">Tu opinión ayuda a mejorar la app. Puedes adjuntar una captura de pantalla.</p>
          </div>
          <form onSubmit={handleSubmit} className="space-y-5">
            <div>
              <label className="block text-xs text-muted uppercase tracking-wider mb-2">Tipo</label>
              <div className="flex gap-2">
                {TYPES.map(([v,l])=>(
                  <button type="button" key={v} onClick={()=>set('type',v)}
                    className={`flex-1 py-2.5 px-2 rounded-xl text-sm font-semibold border transition-all ${
                      form.type===v ? 'bg-brand-blue/20 border-brand-blue text-brand-blue' : 'bg-surface-2 border-border text-muted hover:text-white'
                    }`}>{l}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Tu nombre (opcional)</label>
              <input type="text" value={form.name} onChange={e=>set('name',e.target.value)}
                placeholder="¿Cómo quieres que te llamemos?"
                className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] transition-colors"/>
            </div>
            <div>
              <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Descripción *</label>
              <textarea value={form.description} onChange={e=>set('description',e.target.value)} required rows={5}
                placeholder="Describe detalladamente el problema o sugerencia..."
                className="w-full bg-surface-2 border border-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-blue placeholder-[#4d5169] resize-none transition-colors"/>
            </div>
            <div>
              <label className="block text-xs text-muted uppercase tracking-wider mb-1.5">Captura de pantalla (opcional)</label>
              <label className="flex flex-col items-center justify-center border-2 border-dashed border-border rounded-xl p-6 cursor-pointer hover:border-brand-blue transition-all group">
                <input type="file" accept="image/*" onChange={handleImage} className="hidden"/>
                {preview ? (
                  <img src={preview} className="max-h-48 rounded-lg object-contain" alt="preview"/>
                ) : (
                  <>
                    <span className="text-3xl mb-2 group-hover:scale-110 transition-transform">📷</span>
                    <span className="text-muted text-sm">Haz clic para subir una imagen (máx. 5 MB)</span>
                  </>
                )}
              </label>
              {preview && (
                <button type="button" onClick={()=>{setPreview(null);set('image_data',null);}}
                  className="text-xs text-muted hover:text-brand-red mt-1.5 transition-colors">
                  × Quitar imagen
                </button>
              )}
            </div>
            {error && (
              <div className="text-brand-red text-sm bg-brand-red/10 border border-brand-red/30 px-4 py-3 rounded-xl">
                {error}
              </div>
            )}
            <button type="submit" disabled={loading}
              className={`w-full py-3 rounded-xl font-bold text-sm transition-all ${
                loading ? 'bg-[#3d4266] text-muted cursor-not-allowed' : 'bg-brand-blue hover:bg-[#3d7de0] text-white active:scale-[.98]'
              }`}>
              {loading ? 'Enviando...' : 'Enviar reporte'}
            </button>
          </form>
        </div>
      );
    }

    /* ── CalendarTab ─────────────────────────────────────────────────────── */
    function CalendarTab({ token }) {
      const now = new Date();
      const [year,        setYear]        = useState(now.getFullYear());
      const [month,       setMonth]       = useState(now.getMonth() + 1);
      const [calData,     setCalData]     = useState(null);
      const [loading,     setLoading]     = useState(false);
      const [selDay,      setSelDay]      = useState(null);
      const [dayDetail,   setDayDetail]   = useState(null);
      const [loadingDay,  setLoadingDay]  = useState(false);
      const [casheaList,  setCasheaList]  = useState([]);
      const [showCForm,   setShowCForm]   = useState(false);
      const [cForm,       setCForm]       = useState({ due_date:'', amount_usd:'', description:'' });
      const [savingC,     setSavingC]     = useState(false);

      const authH = { 'Authorization': `Bearer ${token}` };
      const jsonH = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

      const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                           'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      const DAY_NAMES   = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

      const loadCalendar = () => {
        setCalData(null); setLoading(true);
        fetch(`/api/calendar/${year}/${month}`, { headers: authH })
          .then(r=>r.json()).then(setCalData).catch(()=>{}).finally(()=>setLoading(false));
      };
      const loadCashea = () => {
        fetch('/api/cashea', { headers: authH })
          .then(r=>r.json()).then(d=>setCasheaList(Array.isArray(d)?d:[])).catch(()=>{});
      };

      useEffect(() => { loadCalendar(); }, [year, month]);
      useEffect(() => { loadCashea(); },  []);

      const handleDayClick = day => {
        const hasTxns    = !!calData?.days?.[String(day)]?.count;
        const hasCashea  = !!(calData?.days?.[String(day)]?.cashea?.length);
        if (!hasTxns && !hasCashea) return;
        setSelDay(day); setDayDetail(null); setLoadingDay(true);
        fetch(`/api/calendar/${year}/${month}/${day}`, { headers: authH })
          .then(r=>r.json()).then(setDayDetail).catch(()=>{}).finally(()=>setLoadingDay(false));
      };

      const closeModal = () => { setSelDay(null); setDayDetail(null); };

      const prevMonth = () => { if(month===1){setYear(y=>y-1);setMonth(12);}else setMonth(m=>m-1); };
      const nextMonth = () => { if(month===12){setYear(y=>y+1);setMonth(1);}else setMonth(m=>m+1); };

      const handleCasheaAdd = async e => {
        e.preventDefault();
        if (!cForm.due_date || !cForm.amount_usd) return;
        setSavingC(true);
        try {
          await fetch('/api/cashea', {
            method:'POST', headers: jsonH,
            body: JSON.stringify({ due_date: cForm.due_date+'T08:00:00', amount_usd: parseFloat(cForm.amount_usd), description: cForm.description||null }),
          });
          setCForm({ due_date:'', amount_usd:'', description:'' });
          setShowCForm(false);
          loadCashea(); loadCalendar();
        } catch(e){} finally { setSavingC(false); }
      };

      const handleCasheaToggle = async id => {
        await fetch(`/api/cashea/${id}/toggle`, { method:'PUT', headers: authH });
        loadCashea(); loadCalendar();
        if (selDay) {
          fetch(`/api/calendar/${year}/${month}/${selDay}`, { headers: authH })
            .then(r=>r.json()).then(setDayDetail).catch(()=>{});
        }
      };

      const handleCasheaDelete = async id => {
        if (!confirm('¿Eliminar esta fecha de pago Cashea?')) return;
        await fetch(`/api/cashea/${id}`, { method:'DELETE', headers: authH });
        loadCashea(); loadCalendar();
        if (selDay) {
          fetch(`/api/calendar/${year}/${month}/${selDay}`, { headers: authH })
            .then(r=>r.json()).then(setDayDetail).catch(()=>{});
        }
      };

      const daysInMonth = calData?.days_in_month || new Date(year, month, 0).getDate();
      const firstDow    = new Date(year, month - 1, 1).getDay();
      const startOffset = firstDow === 0 ? 6 : firstDow - 1;

      const monthIngresos = calData ? Object.values(calData.days).reduce((s,d)=>s+d.ingresos,0) : 0;
      const monthGastos   = calData ? Object.values(calData.days).reduce((s,d)=>s+d.gastos,0)   : 0;
      const monthNet      = monthIngresos - monthGastos;

      const detailIngresos = dayDetail?.transactions?.reduce((s,t)=>s+(t.type==='ingreso'?t.amount_ves:0),0) ?? 0;
      const detailGastos   = dayDetail?.transactions?.reduce((s,t)=>s+(t.type==='gasto'  ?t.amount_ves:0),0) ?? 0;
      const detailNet      = detailIngresos - detailGastos;

      const casheaThisMonth  = casheaList.filter(c=>{ const d=new Date(c.due_date); return d.getFullYear()===year&&(d.getMonth()+1)===month; }).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));
      const casheaOtherMonths = casheaList.filter(c=>{ const d=new Date(c.due_date); return !(d.getFullYear()===year&&(d.getMonth()+1)===month); }).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));

      const fmtDueDate = iso => { const d=new Date(iso); return d.toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric'}); };

      return (
        <div className="fade-in space-y-5">
          {/* Encabezado */}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h2 className="text-xl font-black text-white">Calendario Financiero</h2>
              <p className="text-muted text-sm">Haz clic en un día para ver el detalle</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={prevMonth} className="bg-surface border border-border text-white rounded-lg w-9 h-9 flex items-center justify-center hover:border-brand-blue transition-all text-xl font-bold">‹</button>
              <span className="text-white font-black text-base min-w-[175px] text-center">{MONTH_NAMES[month-1]} {year}</span>
              <button onClick={nextMonth} className="bg-surface border border-border text-white rounded-lg w-9 h-9 flex items-center justify-center hover:border-brand-blue transition-all text-xl font-bold">›</button>
            </div>
          </div>

          {/* Resumen del mes */}
          {calData && (
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-brand-green/10 border border-brand-green/25 rounded-xl px-4 py-3 text-center">
                <div className="text-[11px] text-muted uppercase tracking-wider font-bold mb-1">Ingresos del mes</div>
                <div className="text-brand-green font-black text-base">{fmtVES(monthIngresos)}</div>
              </div>
              <div className="bg-brand-red/10 border border-brand-red/25 rounded-xl px-4 py-3 text-center">
                <div className="text-[11px] text-muted uppercase tracking-wider font-bold mb-1">Gastos del mes</div>
                <div className="text-brand-red font-black text-base">{fmtVES(monthGastos)}</div>
              </div>
              <div className={`rounded-xl px-4 py-3 text-center border ${monthNet>=0?'bg-brand-green/10 border-brand-green/25':'bg-brand-red/10 border-brand-red/25'}`}>
                <div className="text-[11px] text-muted uppercase tracking-wider font-bold mb-1">Balance neto</div>
                <div className={`font-black text-base ${monthNet>=0?'text-brand-green':'text-brand-red'}`}>{fmtVES(monthNet)}</div>
              </div>
            </div>
          )}

          {/* Grilla del calendario */}
          <div className="bg-surface border border-border rounded-2xl overflow-hidden">
            <div className="grid grid-cols-7 border-b border-border bg-surface-2">
              {DAY_NAMES.map(d=>(
                <div key={d} className="py-2.5 text-center text-[11px] font-bold text-muted uppercase tracking-wider">{d}</div>
              ))}
            </div>

            {loading ? (
              <div className="py-20 text-center text-muted text-sm">Cargando...</div>
            ) : (
              <div className="grid grid-cols-7">
                {Array.from({length: startOffset}).map((_,i)=>(
                  <div key={`e${i}`} className="min-h-[90px] border-b border-r border-border/30 bg-[#0f1117]/40" />
                ))}
                {Array.from({length: daysInMonth}).map((_,i)=>{
                  const day      = i + 1;
                  const d        = calData?.days?.[String(day)];
                  const isToday  = now.getFullYear()===year && (now.getMonth()+1)===month && now.getDate()===day;
                  const net      = d ? (d.ingresos - d.gastos) : 0;
                  const hasCash  = d?.cashea?.length > 0;
                  const col      = (startOffset + i) % 7;
                  const hasAny   = d && (d.count > 0 || hasCash);

                  let cellCls = 'bg-surface hover:bg-surface-2/30 cursor-default';
                  if (d && d.count > 0) {
                    cellCls = net > 0
                      ? 'bg-brand-green/5 border-l-2 border-l-brand-green hover:bg-brand-green/10 cursor-pointer'
                      : net < 0
                        ? 'bg-brand-red/5 border-l-2 border-l-brand-red hover:bg-brand-red/10 cursor-pointer'
                        : 'hover:bg-surface-2/60 cursor-pointer';
                  } else if (hasCash) {
                    cellCls = 'bg-[#FFE50010]/20 border-l-2 border-l-[#FFE500] hover:bg-[#FFE500]/10 cursor-pointer';
                  }

                  return (
                    <div
                      key={day}
                      onClick={()=>handleDayClick(day)}
                      className={`min-h-[90px] p-1.5 border-b border-r border-border/30 transition-all ${cellCls} ${col===6?'border-r-0':''}`}
                    >
                      <div className={`text-[11px] font-black w-5 h-5 flex items-center justify-center rounded-full mb-0.5 ${isToday?'bg-brand-blue text-white':'text-muted'}`}>{day}</div>

                        <div className="space-y-0.5">

                          {d.gastos  >0 && <div className="text-[10px] font-semibold text-brand-red   leading-tight truncate">-{fmtAbbr(d.gastos)}</div>}
